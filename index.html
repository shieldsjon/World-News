<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Lens — Unbiased World News Network</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Georgia&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #fcfbf9;
      --bg-surface: #ffffff;
      --bg-alt: #f4f1ea;
      --border-color: #111111;
      --border-light: #e2ded4;
      --text-primary: #111111;
      --text-muted: #555555;
      --accent-red: #8b0000;
      --accent-green: #2d5a27;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-body: 'Georgia', serif;
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
    }

    [data-theme="dark"] {
      --bg-primary: #121212;
      --bg-surface: #1e1e1e;
      --bg-alt: #252525;
      --border-color: #e2ded4;
      --border-light: #333333;
      --text-primary: #f4f1ea;
      --text-muted: #aaaaaa;
      --accent-red: #ff6b6b;
      --accent-green: #51cf66;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      font-family: var(--font-body);
      line-height: 1.6;
      transition: background-color 0.3s, color 0.3s;
    }

    /* Ticker Tape */
    .ticker-bar {
      background: var(--text-primary);
      color: var(--bg-primary);
      font-family: var(--font-sans);
      font-size: 0.75rem;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      overflow: hidden;
      white-space: nowrap;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      height: 32px;
    }

    .ticker-label {
      background: var(--accent-red);
      color: #fff;
      padding: 0 12px;
      font-weight: 700;
      height: 100%;
      display: flex;
      align-items: center;
      z-index: 2;
    }

    .ticker-track {
      display: inline-block;
      white-space: nowrap;
      animation: ticker-loop 120s linear infinite;
    }

    @keyframes ticker-loop {
      0% { transform: translate3d(0, 0, 0); }
      100% { transform: translate3d(-50%, 0, 0); }
    }

    .ticker-item {
      display: inline-block;
      padding: 0 20px;
    }

    /* Header */
    header {
      text-align: center;
      padding: 24px 16px 16px;
      border-bottom: 3px double var(--border-color);
      max-width: 1200px;
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-sans);
      font-size: 0.8rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 8px;
      margin-bottom: 16px;
    }

    .header-title-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text-primary);
      text-decoration: none;
    }

    .header-title-btn h1 {
      font-family: var(--font-serif);
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      text-transform: capitalize;
      line-height: 1;
    }

    .header-tagline {
      font-family: var(--font-serif);
      font-style: italic;
      font-size: 1rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* Controls Bar */
    .controls-bar {
      max-width: 1200px;
      margin: 16px auto;
      padding: 0 16px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 16px;
    }

    .nav-categories {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .nav-btn {
      background: transparent;
      border: 1px solid transparent;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 6px 12px;
      cursor: pointer;
      color: var(--text-primary);
      transition: all 0.2s;
    }

    .nav-btn:hover, .nav-btn.active {
      border-color: var(--border-color);
      background: var(--bg-alt);
    }

    /* Toggle Switch */
    .toggle-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-sans);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 24px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--accent-green); }
    input:checked + .slider:before { transform: translateX(22px); }

    /* Layout Main */
    main {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 32px;
    }

    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }

    /* Feed List View */
    .news-feed {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .story-item {
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .story-meta {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: var(--font-sans);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .story-badge {
      padding: 2px 6px;
      border: 1px solid var(--border-color);
      font-weight: 700;
    }

    .feel-good-badge {
      background: var(--accent-green);
      color: #fff;
      border: none;
    }

    .story-title {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.25;
      color: var(--text-primary);
      text-decoration: none;
      cursor: pointer;
    }

    .story-title:hover {
      color: var(--accent-red);
    }

    .key-facts-box {
      background: var(--bg-alt);
      border-left: 3px solid var(--border-color);
      padding: 12px 16px;
      font-size: 0.95rem;
    }

    .key-facts-box h4 {
      font-family: var(--font-sans);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
      color: var(--text-muted);
    }

    .key-facts-box ul {
      padding-left: 18px;
    }

    .key-facts-box li {
      margin-bottom: 4px;
    }

    .story-sources {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      font-family: var(--font-sans);
      font-size: 0.8rem;
    }

    .source-link {
      color: var(--accent-red);
      text-decoration: none;
      border-bottom: 1px dotted var(--accent-red);
      font-weight: 600;
    }

    .source-link:hover {
      border-bottom-style: solid;
    }

    /* Sidebar */
    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 24px;
      border-left: 1px solid var(--border-light);
      padding-left: 24px;
    }

    .sidebar-widget {
      border-bottom: 1px solid var(--border-light);
      padding-bottom: 16px;
    }

    .sidebar-widget h3 {
      font-family: var(--font-sans);
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 12px;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 4px;
    }

    .select-country {
      width: 100%;
      padding: 8px;
      font-family: var(--font-sans);
      font-size: 0.9rem;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
    }

    .outlet-list {
      font-family: var(--font-sans);
      font-size: 0.8rem;
      line-height: 1.8;
      color: var(--text-muted);
      list-style: none;
      max-height: 400px;
      overflow-y: auto;
    }

    .outlet-list li {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dashed var(--border-light);
      padding: 2px 0;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.6);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 16px;
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      background: var(--bg-surface);
      border: 2px solid var(--border-color);
      max-width: 700px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      padding: 24px;
      position: relative;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-primary);
    }
  </style>
</head>
<body>

  <!-- Ticker Tape -->
  <div class="ticker-bar">
    <div class="ticker-label">Live Wire</div>
    <div class="ticker-track" id="tickerTrack">
      <span class="ticker-item">Connecting to 35 global news bureaus...</span>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="header-top">
      <span id="liveClock">Global Lens Network</span>
      <span id="refreshCounter">Next live fetch in: 05:00</span>
      <button onclick="toggleTheme()" style="background:none; border:none; cursor:pointer; font-family:var(--font-sans); font-size:0.8rem; color:var(--text-muted)">🌗 Toggle Theme</button>
    </div>
    <button class="header-title-btn" onclick="resetApp()">
      <h1>Global Lens</h1>
    </button>
    <div class="header-tagline">35-Bureau Global Independent News Aggregator</div>
  </header>

  <!-- Controls Bar -->
  <div class="controls-bar">
    <div class="nav-categories" id="categoryNav">
      <button class="nav-btn active" onclick="setCategory('Top 10')">Top 10 World Stories</button>
      <button class="nav-btn" onclick="setCategory('U.S.')">U.S.</button>
      <button class="nav-btn" onclick="setCategory('World')">World</button>
      <button class="nav-btn" onclick="setCategory('Governance')">Governance & Diplomacy</button>
      <button class="nav-btn" onclick="setCategory('Economy')">Economy & Markets</button>
      <button class="nav-btn" onclick="setCategory('Tech')">Tech & Science</button>
      <button class="nav-btn" onclick="setCategory('Climate')">Climate & Energy</button>
      <button class="nav-btn" onclick="setCategory('Arts')">Arts</button>
      <button class="nav-btn" onclick="setCategory('Lifestyle')">Lifestyle</button>
      <button class="nav-btn" onclick="setCategory('Sports')">Sports</button>
    </div>

    <div class="toggle-wrapper">
      <span>Feel-Good Stories</span>
      <label class="switch">
        <input type="checkbox" id="feelGoodToggle" onchange="toggleFeelGood()">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <!-- Main Container -->
  <main>
    <!-- News Feed -->
    <div class="news-feed" id="newsFeed">
      <div style="text-align:center; padding:40px; font-family:var(--font-sans); color:var(--text-muted)">
        Fetching real-time headlines from 35 international news bureaus...
      </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-widget">
        <h3>Filter By Country</h3>
        <select class="select-country" id="countrySelect" onchange="filterCountry()">
          <option value="ALL">All Nations (Global View)</option>
          <option value="United States">United States</option>
          <option value="United Kingdom">United Kingdom</option>
          <option value="Canada">Canada</option>
          <option value="Germany">Germany</option>
          <option value="France">France</option>
          <option value="Australia">Australia</option>
          <option value="Japan">Japan</option>
          <option value="China">China</option>
          <option value="India">India</option>
          <option value="International">International / UN</option>
        </select>
      </div>

      <div class="sidebar-widget">
        <h3>35 Connected Outlets</h3>
        <ul class="outlet-list" id="outletList"></ul>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal-overlay" id="compareModal">
    <div class="modal-card">
      <button class="modal-close" onclick="closeModal()">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <script>
    let rawStories = [];
    let activeCategory = 'Top 10';
    let activeCountry = 'ALL';
    let feelGoodOnly = false;
    let refreshSeconds = 300;

    // 35 Diverse Global Feeds
    const rssSources = [
      { name: "BBC News World", defaultCategory: "World", url: "https://feeds.bbci.co.uk/news/world/rss.xml" },
      { name: "Al Jazeera English", defaultCategory: "World", url: "https://www.aljazeera.com/xml/rss/all.xml" },
      { name: "NPR World", defaultCategory: "World", url: "https://feeds.npr.org/1004/rss.xml" },
      { name: "NPR US News", defaultCategory: "U.S.", url: "https://feeds.npr.org/1001/rss.xml" },
      { name: "Deutsche Welle", defaultCategory: "Governance", url: "https://rss.dw.com/rdf/rss-en-world" },
      { name: "UN News Bureau", defaultCategory: "Climate", url: "https://news.un.org/feed/subscribe/en/news/all/rss.xml" },
      { name: "CBC News Canada", defaultCategory: "World", url: "https://www.cbc.ca/cbbc/lineup/topstories.xml" },
      { name: "France 24 English", defaultCategory: "World", url: "https://www.france24.com/en/rss" },
      { name: "The Guardian World", defaultCategory: "World", url: "https://www.theguardian.com/world/rss" },
      { name: "The Guardian Tech", defaultCategory: "Tech", url: "https://www.theguardian.com/technology/rss" },
      { name: "CNBC Business", defaultCategory: "Economy", url: "https://search.cnbc.com/rs/search/combinedrender?source=0&id=100003114&trendline=38&categories=100003114&partnerId=2000&keywords=1" },
      { name: "ABC News US", defaultCategory: "U.S.", url: "https://abcnews.go.com/abcnews/topstories" },
      { name: "SBS World Australia", defaultCategory: "World", url: "https://www.sbs.com.au/news/feed" },
      { name: "NPR Technology", defaultCategory: "Tech", url: "https://feeds.npr.org/1019/rss.xml" },
      { name: "NPR Culture & Arts", defaultCategory: "Arts", url: "https://feeds.npr.org/1008/rss.xml" },
      { name: "NPR Science", defaultCategory: "Tech", url: "https://feeds.npr.org/1007/rss.xml" },
      { name: "NPR Business", defaultCategory: "Economy", url: "https://feeds.npr.org/1017/rss.xml" },
      { name: "BBC Sports Desk", defaultCategory: "Sports", url: "https://feeds.bbci.co.uk/sport/rss.xml" },
      { name: "BBC Tech Wire", defaultCategory: "Tech", url: "https://feeds.bbci.co.uk/news/technology/rss.xml" },
      { name: "BBC Arts & Life", defaultCategory: "Arts", url: "https://feeds.bbci.co.uk/news/entertainment_and_arts/rss.xml" },
      { name: "NASA Science Wire", defaultCategory: "Tech", url: "https://www.nasa.gov/rss/dyn/breaking_news.rss" },
      { name: "Wired Technology", defaultCategory: "Tech", url: "https://www.wired.com/feed/rss" },
      { name: "EuroNews Europe", defaultCategory: "World", url: "https://www.euronews.com/rss?format=mrss&level=theme&name=news" },
      { name: "Politico Diplomacy", defaultCategory: "Governance", url: "https://www.politico.eu/feed/" },
      { name: "EcoWatch Climate", defaultCategory: "Climate", url: "https://www.ecowatch.com/feeds/feed.rss" },
      { name: "Japan Today", defaultCategory: "World", url: "https://japantoday.com/feed" },
      { name: "The Straits Times Asia", defaultCategory: "World", url: "https://www.straitstimes.com/news/world/rss.xml" },
      { name: "The Hindu International", defaultCategory: "World", url: "https://www.thehindu.com/news/international/feeder/default.rss" },
      { name: "RFI France International", defaultCategory: "World", url: "https://www.rfi.fr/en/general/rss" },
      { name: "Irish Times World", defaultCategory: "World", url: "https://www.irishtimes.com/c2win/rss/news/world" },
      { name: "South China Morning Post", defaultCategory: "World", url: "https://www.scmp.com/rss/91/feed" },
      { name: "AllAfrica World News", defaultCategory: "World", url: "https://allafrica.com/tools/headlines/rdf/latest/headlines.rdf" },
      { name: "Buenos Aires Times", defaultCategory: "World", url: "https://www.batimes.com.ar/feed" },
      { name: "Sydney Morning Herald", defaultCategory: "World", url: "https://www.smh.com.au/rss/feed.xml" },
      { name: "National Geographic Environment", defaultCategory: "Climate", url: "https://www.nationalgeographic.com/rss/index.html" }
    ];

    async function fetchSingleFeed(src) {
      const proxyUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(src.url)}`;
      try {
        const response = await fetch(proxyUrl);
        const data = await response.json();

        if (data.status === 'ok' && data.items && data.items.length > 0) {
          return data.items.map((item, idx) => {
            const title = item.title || "";
            const rawDesc = item.description || item.content || "";
            const snippet = rawDesc.replace(/<[^>]*>?/gm, '').trim().slice(0, 240) + "...";
            const isPositive = checkIfFeelGood(title + " " + snippet);
            
            return {
              id: `${src.name.replace(/\s+/g, '')}-${idx}-${Date.now()}`,
              title: title,
              category: src.defaultCategory,
              country: detectCountry(title + " " + snippet),
              feelGood: isPositive,
              pubDate: item.pubDate || new Date().toISOString(),
              keyFacts: [
                snippet || "Direct wire headline report.",
                `Reporting Outlet: ${src.name}`,
                `Source Timestamp: ${item.pubDate || 'Recent Wire'}`
              ],
              sources: [
                { name: src.name, url: item.link || src.url, bias: "Wire Report" }
              ]
            };
          });
        }
      } catch (e) {
        console.warn(`Feed error on ${src.name}:`, e);
      }
      return [];
    }

    async function fetchLiveNews() {
      const results = await Promise.allSettled(rssSources.map(src => fetchSingleFeed(src)));
      let allArticles = [];

      results.forEach(res => {
        if (res.status === 'fulfilled' && res.value && res.value.length > 0) {
          allArticles.push(...res.value);
        }
      });

      // Deduplicate by headline title
      const uniqueMap = new Map();
      allArticles.forEach(item => {
        if (!uniqueMap.has(item.title.toLowerCase())) {
          uniqueMap.set(item.title.toLowerCase(), item);
        }
      });

      if (uniqueMap.size > 0) {
        rawStories = Array.from(uniqueMap.values()).sort(() => 0.5 - Math.random());
        updateTicker();
        renderSidebarOutlets();
        renderFeed();
      }
    }

    function checkIfFeelGood(text) {
      const positiveWords = ['win', 'breakthrough', 'peace', 'save', 'hope', 'discovery', 'grant', 'aid', 'conservation', 'restored', 'clean', 'agree', 'award', 'pact', 'solution', 'cured'];
      const lower = text.toLowerCase();
      return positiveWords.some(w => lower.includes(w));
    }

    function detectCountry(text) {
      if (/US|U\.S\.|United States|Washington|Biden|Trump|Congress/i.test(text)) return "United States";
      if (/UK|Britain|London|Parliament/i.test(text)) return "United Kingdom";
      if (/Canada|Ottawa/i.test(text)) return "Canada";
      if (/Germany|Berlin/i.test(text)) return "Germany";
      if (/France|Paris/i.test(text)) return "France";
      if (/Australia|Sydney|Canberra/i.test(text)) return "Australia";
      if (/China|Beijing/i.test(text)) return "China";
      if (/Japan|Tokyo/i.test(text)) return "Japan";
      if (/India|Delhi/i.test(text)) return "India";
      return "International";
    }

    function renderFeed() {
      const feedEl = document.getElementById('newsFeed');
      let filtered = [...rawStories];

      if (activeCategory === 'Top 10') {
        filtered = filtered.slice(0, 10);
      } else if (activeCategory !== 'ALL') {
        filtered = filtered.filter(s => s.category.toLowerCase().includes(activeCategory.toLowerCase()));
      }

      if (activeCountry !== 'ALL') {
        filtered = filtered.filter(s => s.country === activeCountry);
      }

      if (feelGoodOnly) {
        filtered = filtered.filter(s => s.feelGood);
      }

      if (filtered.length === 0) {
        feedEl.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted)">No stories match current filter parameters.</div>`;
        return;
      }

      feedEl.innerHTML = filtered.map(story => `
        <article class="story-item">
          <div class="story-meta">
            <span class="story-badge">${story.category}</span>
            <span>${story.country}</span>
            ${story.feelGood ? `<span class="story-badge feel-good-badge">☀️ Feel-Good</span>` : ''}
          </div>
          <a class="story-title" onclick="openModal('${story.id}')">${story.title}</a>
          <div class="key-facts-box">
            <h4>Key Verified Facts</h4>
            <ul>
              ${story.keyFacts.map(fact => `<li>${fact}</li>`).join('')}
            </ul>
          </div>
          <div class="story-sources">
            <span>Primary Outlet:</span>
            <a href="${story.sources[0].url}" target="_blank" rel="noopener noreferrer" class="source-link">${story.sources[0].name}</a>
          </div>
        </article>
      `).join('');
    }

    function renderSidebarOutlets() {
      const list = document.getElementById('outletList');
      list.innerHTML = rssSources.map(s => `<li><span>${s.name}</span> <span style="color:var(--accent-green)">Live</span></li>`).join('');
    }

    function updateTicker() {
      const track = document.getElementById('tickerTrack');
      if (rawStories.length > 0) {
        const items = rawStories.slice(0, 10).map(s => `<span class="ticker-item">● ${s.title}</span>`).join('');
        track.innerHTML = items + items;
      }
    }

    function setCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.includes(cat));
      });
      renderFeed();
    }

    function filterCountry() {
      activeCountry = document.getElementById('countrySelect').value;
      renderFeed();
    }

    function toggleFeelGood() {
      feelGoodOnly = document.getElementById('feelGoodToggle').checked;
      renderFeed();
    }

    function resetApp() {
      activeCategory = 'Top 10';
      activeCountry = 'ALL';
      feelGoodOnly = false;
      document.getElementById('feelGoodToggle').checked = false;
      document.getElementById('countrySelect').value = 'ALL';
      setCategory('Top 10');
    }

    function openModal(id) {
      const story = rawStories.find(s => s.id === id);
      if (!story) return;

      document.getElementById('modalContent').innerHTML = `
        <div class="story-meta" style="margin-bottom:12px">
          <span class="story-badge">${story.category}</span>
          <span>${story.country}</span>
        </div>
        <h2 style="font-family:var(--font-serif); font-size:1.8rem; margin-bottom:16px">${story.title}</h2>
        <div class="key-facts-box" style="margin-bottom:20px">
          <h4>Full Summary & Key Facts</h4>
          <ul>${story.keyFacts.map(f => `<li>${f}</li>`).join('')}</ul>
        </div>
        <h4>Direct Source Article:</h4>
        <p style="margin-top:8px">
          <a href="${story.sources[0].url}" target="_blank" rel="noopener noreferrer" class="source-link" style="font-size:1.1rem">
            Read full coverage on ${story.sources[0].name} &rarr;
          </a>
        </p>
      `;
      document.getElementById('compareModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('compareModal').classList.remove('active');
    }

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      document.body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
    }

    // Auto Refresh Countdown Timer
    setInterval(() => {
      refreshSeconds--;
      if (refreshSeconds <= 0) {
        refreshSeconds = 300;
        fetchLiveNews();
      }
      const mins = String(Math.floor(refreshSeconds / 60)).padStart(2, '0');
      const secs = String(refreshSeconds % 60).padStart(2, '0');
      document.getElementById('refreshCounter').innerText = `Next live fetch in: ${mins}:${secs}`;
    }, 1000);

    // Initial Execution
    fetchLiveNews();
  </script>
</body>
</html>
