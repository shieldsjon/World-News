name: Fetch Live News Automated Schedule

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs automatically every 5 minutes
  workflow_dispatch:      # Adds a "Run workflow" button in GitHub UI for testing

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Grants permissions to commit news.json back to repo

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install Dependencies
        run: pip install feedparser

      - name: Run News Collector Script
        run: python build_news.py

      - name: Commit Updated news.json
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add news.json
          git commit -m "Auto-update live news feed [skip ci]" || exit 0
          git push
